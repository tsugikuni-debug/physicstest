<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Mega Test for Begum Sahiba ⚡⚛️</title>
    <style>
        :root {
            --primary: #0d47a1;
            --primary-light: #e3f2fd;
            --primary-hover: #0a3880;
            --text: #1a237e;
            --card-bg: #ffffff;
            --correct-bg: #e8f5e9;
            --correct-border: #2e7d32;
            --wrong-bg: #ffebee;
            --wrong-border: #c62828;
            --skipped-bg: #fff8e1;
            --skipped-border: #f57f17;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 760px;
            padding: 32px 28px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(13, 71, 161, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 16px;
            border-bottom: 2px dashed #90caf9;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.95rem;
            color: #546e7a;
            font-weight: 500;
        }

        #result-summary {
            display: none;
            background: #ffffff;
            border: 2px solid var(--primary);
            padding: 22px;
            border-radius: 18px;
            margin-bottom: 25px;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .score-display {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-item span {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .question-card {
            margin-bottom: 22px;
            padding: 22px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 5px solid var(--primary);
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.5;
            color: #1e293b;
        }

        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #bbdefb;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .media-container img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .media-container svg {
            max-width: 100%;
            height: auto;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-item label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .option-item label:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .badge-correct { background: #c8e6c9; color: #2e7d32; }
        .badge-wrong { background: #ffcdd2; color: #c62828; }
        .badge-skipped { background: #fff9c4; color: #f57f17; }

        .explanation-box {
            display: none;
            margin-top: 14px;
            padding: 14px;
            background: #f0f7ff;
            border-radius: 10px;
            font-size: 0.92rem;
            line-height: 1.55;
            border: 1px solid #bbdefb;
            color: #263238;
        }

        .submit-btn, .restart-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(13, 71, 161, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover, .restart-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Physics Board Mega Test ⚡⚛️</h1>
        <p>Curated for Begum Sahiba ✨ (40 Objective Questions)</p>
    </div>

    <!-- Result Summary -->
    <div id="result-summary">
        <h2>Test Result 🎉</h2>
        <div class="score-display" id="score-text">0 / 40</div>
        <p id="feedback-text" style="font-size: 1.05rem; font-weight: 600;"></p>
        
        <div class="stats-grid">
            <div class="stat-item" style="color: #2e7d32;">
                Correct
                <span id="stat-correct">0</span>
            </div>
            <div class="stat-item" style="color: #c62828;">
                Incorrect
                <span id="stat-wrong">0</span>
            </div>
            <div class="stat-item" style="color: #f57f17;">
                Not Attended
                <span id="stat-skipped">0</span>
            </div>
        </div>
    </div>

    <!-- Questions Form -->
    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="submit" id="submit-btn" class="submit-btn">Submit Physics Test 🎯</button>
    </form>

    <button id="restart-btn" class="restart-btn" style="display: none;" onclick="location.reload()">Dobara Try Karein 🔄</button>
</div>

<script>
    const quizData = [
        // ================= SECTION 1: ELECTROSTATICS & CAPACITANCE (1 - 10) =================
        {
            question: "1. एक पक्षी आकर एक नंगी हाई-पावर बिजली लाइन पर बैठ जाता है (जैसा चित्र में दिखाया गया है)। वह:",
            image: "https://images.unsplash.com/photo-1549608276-5786777e6587?auto=format&fit=crop&w=700&q=80",
            options: ["एक हल्के झटके का अनुभव करेगा", "एक मजबूत झटके का अनुभव करेगा", "तत्काल मारा जाएगा", "व्यावहारिक रूप से अप्रभावित रहेगा"],
            answer: 3,
            explanation: "पक्षी के दोनों पंजे एक ही तार पर पास-पास होते हैं, जिससे उनके बीच कोई विभवांतर (ΔV = 0) उत्पन्न नहीं होता और परिपथ जमीन के साथ पूरा नहीं होता।"
        },
        {
            question: "2. आवेश (Electric Charge) की न्यूनतम संभव (मूल) मात्रा है:",
            options: ["1 C", "4.8 × 10¹⁸ C", "1.6 × 10⁻¹⁹ C", "1.6 × 10¹⁹ C"],
            answer: 2,
            explanation: "मूल आवेश (Elementary charge, e) का मान 1.6 × 10⁻¹⁹ C होता है। सभी आवेश इसी के पूर्ण गुणज (q = ±ne) होते हैं।"
        },
        {
            question: "3. वैद्युत फ्लक्स (Electric Flux) का मात्रक होता है:",
            options: ["Weber", "N m² C⁻¹", "N/m", "m²/s"],
            answer: 1,
            explanation: "विद्युत फ्लक्स Φ = E · A होता है, अतः मात्रक (N/C) × m² = N m² C⁻¹ (या Volt-meter) होता है।"
        },
        {
            question: "4. निम्नलिखित में से कौन विद्युत क्षेत्र (Electric Field) की इकाई है?",

            answer: 3,
            explanation: "विद्युत क्षेत्र E = F/q होता है, इसलिए इसका मात्रक न्यूटन/कूलम्ब (N/C) या वोल्ट/मीटर (V/m) होता है।"
        },
        {

            answer: 2,
            explanation: "कूलम्ब के नियम (F = q₁q₂ / 4πε₀r²) से ε₀ = C² / (N·m²) = N⁻¹ m⁻² C² प्राप्त होता है।"
        },
        {
            question: "6. विद्युत द्विध्रुव आघूर्ण (Electric Dipole Moment) की SI इकाई है:",

            answer: 2,
            explanation: "द्विध्रुव आघूर्ण p = q × 2a होता है, जिसकी इकाई कूलम्ब-मीटर (C m) है।"
        },
        {
            question: "7. निम्नलिखित में से किसे संधारित्र (Capacitor) द्वारा अवरुद्ध (Block) किया जाता है?",
            options: ["प्रत्यावर्ती धारा (AC)", "दिष्ट धारा (DC)", "AC और DC दोनों", "न तो AC और न ही DC"],
            answer: 1,
            explanation: "DC के लिए आवृत्ति f = 0 होती है, जिससे संधारित्र का प्रतिघात Xc = 1/(2πfC) अनंत हो जाता है और DC पूरी तरह ब्लॉक हो जाती है।"
        },
        {
            question: "8. विद्युत स्थितिज ऊर्जा (Electric Potential Energy) की SI इकाई का चयन कीजिए:",

            answer: 0,
            explanation: "ऊर्जा तथा कार्य का SI मात्रक जूल (Joule) होता है।"
        },
        {
            question: "9. पृथ्वी का विद्युत विभव (Electric Potential) संदर्भ के रूप में क्या माना जाता है?",
            options: ["शून्य (Zero)", "अनंत (Infinite)", "1 Volt", "इनमें से कोई नहीं"],
            answer: 0,
            explanation: "पृथ्वी की धारिता अत्यधिक विशाल होने के कारण संदर्भ (Ground/Earth) का विभव शून्य (0 V) माना जाता है।"
        },
        {
            question: "10. समांतर पट्टिका संधारित्र की प्लेटों के बीच K परावैद्युतांक वाला माध्यम पूरी तरह भरने पर उसकी धारिता:",
            options: ["K गुना बढ़ जाती है", "K गुना घट जाती है", "अपरिवर्तित रहती है", "शून्य हो जाती है"],
            answer: 0,
            explanation: "माध्यम रखने पर प्लेटों के बीच विभवांतर V' = V/K हो जाता है, अतः नई धारिता C' = K·C₀ (K गुना बढ़ जाती है)।"

        // ================= SECTION 2: CURRENT ELECTRICITY (11 - 16) =================

            question: "11. विशिष्ट प्रतिरोध (Resistivity) का SI मात्रक क्या होता है?",

            answer: 1,
            explanation: "विशिष्ट प्रतिरोध ρ = R·A/l होता है, अतः मात्रक (Ω × m²)/m = Ω·m होता है।"
        },
        {
            question: "12. चित्र में प्रदर्शित संधि (Junction P) पर किरचॉफ के प्रथम नियमानुसार अज्ञात धारा I का मान क्या होगा?",
            diagram: `
                <svg width="420" height="180" viewBox="0 0 420 180">
                    <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
                    <circle cx="210" cy="90" r="9" fill="#0d47a1"/>

                    <line x1="50" y1="30" x2="202" y2="86" stroke="#2e7d32" stroke-width="4"/>
                    <polygon points="135,60 120,50 126,68" fill="#2e7d32"/>

        },
        {
            question: "13. किसी चालक तार में प्रवाहित विद्युत धारा (I) तथा अनुगमन वेग (vd) के बीच सही संबंध है:",
            options: ["I = n·e·A·vd", "I = (n·e·A)/vd", "I = vd/(n·e·A)", "I = n²·e·A·vd"],
            answer: 0,
            explanation: "धारा और अपवाह वेग का प्रामाणिक समीकरण I = n·e·A·vd होता है।"

        {
            question: "14. विद्युत हीटर में जिस तत्व का व्यवहार किया जाता है, वह है:",

            answer: 3,
            explanation: "नाइक्रोम का गलनांक एवं प्रतिरोधकता उच्च होती है, जिससे यह तप्त होकर अत्यधिक ऊष्मा देता है।"
        },
        {
            question: "15. व्हीटस्टोन सेतु (Wheatstone Bridge) का उपयोग किसे मापने में किया जाता है?",

            explanation: "व्हीटस्टोन ब्रिज का उपयोग मध्यम, उच्च तथा अल्प दोनों प्रकार के प्रतिरोधों के सटीक मापन में होता है।"
        },
        {

    const submitBtn = document.getElementById("submit-btn");
    const restartBtn = document.getElementById("restart-btn");

    // Render Questions
    quizData.forEach((q, index) => {
        const qCard = document.createElement("div");
        qCard.className = "question-card";
        qCard.id = `q-card-${index}`;

        let optionsHTML = "";
        q.options.forEach((opt, optIdx) => {
            optionsHTML += `
                <li class="option-item">
                    <label id="opt-label-${index}-${optIdx}">
                        <input type="radio" name="q${index}" value="${optIdx}">
                        <span>${opt}</span>
                    </label>
                </li>
            `;
        });

        let mediaHTML = "";
        if (q.image) {
            mediaHTML = `<div class="media-container"><img src="${q.image}" alt="Physics Illustration" loading="lazy"></div>`;
        } else if (q.diagram) {
            mediaHTML = `<div class="media-container">${q.diagram}</div>`;
        }

        qCard.innerHTML = `
            <div id="badge-${index}"></div>
            <div class="question-title">${q.question}</div>
            ${mediaHTML}
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation-box" id="exp-${index}">
                <strong>🤖 AI Explanation:</strong> <br>
                <span id="exp-text-${index}"></span>
            </div>
        `;
        questionsContainer.appendChild(qCard);
    });

    // Handle Form Submit
    quizForm.addEventListener("submit", (e) => {
        e.preventDefault();
        
        let correctCount = 0;
        let wrongCount = 0;
        let skippedCount = 0;

        quizData.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
            const qCard = document.getElementById(`q-card-${index}`);
            const badgeDiv = document.getElementById(`badge-${index}`);
            const expBox = document.getElementById(`exp-${index}`);
            const expText = document.getElementById(`exp-text-${index}`);
            
            const inputs = document.querySelectorAll(`input[name="q${index}"]`);
            inputs.forEach(input => input.disabled = true);

            if (!selectedOption) {
                skippedCount++;
                badgeDiv.innerHTML = `<span class="status-badge badge-skipped">⚠️ Not Attended</span>`;
                qCard.style.borderLeftColor = "var(--skipped-border)";
                expBox.style.display = "block";
                expText.innerHTML = `Aapne yeh sawaal skip kar diya.<br><b>Sahi Answer:</b> ${q.options[q.answer]}<br><i>${q.explanation}</i>`;
            } else {
                const userAns = parseInt(selectedOption.value);
                if (userAns === q.answer) {
                    correctCount++;
                    badgeDiv.innerHTML = `<span class="status-badge badge-correct">✅ Correct</span>`;
                    qCard.style.borderLeftColor = "var(--correct-border)";
                    
                    const correctLabel = document.getElementById(`opt-label-${index}-${userAns}`);
                    correctLabel.style.backgroundColor = "var(--correct-bg)";
                    correctLabel.style.borderColor = "var(--correct-border)";
                } else {
                    wrongCount++;
                    badgeDiv.innerHTML = `<span class="status-badge badge-wrong">❌ Incorrect</span>`;
                    qCard.style.borderLeftColor = "var(--wrong-border)";
                    
                    const wrongLabel = document.getElementById(`opt-label-${index}-${userAns}`);
                    wrongLabel.style.backgroundColor = "var(--wrong-bg)";
                    wrongLabel.style.borderColor = "var(--wrong-border)";

                    const correctLabel = document.getElementById(`opt-label-${index}-${q.answer}`);
                    correctLabel.style.backgroundColor = "var(--correct-bg)";
                    correctLabel.style.borderColor = "var(--correct-border)";

                    expBox.style.display = "block";
                    expText.innerHTML = `Aapka chunav (<b>${q.options[userAns]}</b>) galat tha.<br><b>Sahi Answer:</b> ${q.options[q.answer]}<br><i>${q.explanation}</i>`;

            }
        });

        submitBtn.style.display = "none";
        restartBtn.style.display = "block";
        resultSummary.style.display = "block";

        document.getElementById("score-text").innerText = `${correctCount} / ${quizData.length}`;
        document.getElementById("stat-correct").innerText = correctCount;
        document.getElementById("stat-wrong").innerText = wrongCount;
        document.getElementById("stat-skipped").innerText = skippedCount;

        const feedbackText = document.getElementById("feedback-text");
        if (correctCount === quizData.length) {
            feedbackText.innerText = "Kya baat hai Begum Sahiba! 100% Perfect Score! ⚡👑";
        } else if (correctCount >= 28) {
            feedbackText.innerText = "Bohat shaandar performance! Board exam me topper rank pakki hai! 👍✨";
        } else {
            feedbackText.innerText = "Koi baat nahi! Galat hue sawaalon ki AI explanation padhein aur dobara try karein! 💪❤️";
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
